[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/Finsiii/ZeroBeat-CLI"
rust-version = "1.88"

[workspace.dependencies]
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
rmp-serde = "1"
rusqlite = "0.37"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
