[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/Finsiii/ZeroBeat-CLI"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true

