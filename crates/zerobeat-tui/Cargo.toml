[package]
name = "zerobeat-tui"
version = "0.1.6"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
crossterm.workspace = true
ratatui.workspace = true
thiserror.workspace = true
tokio.workspace = true
zerobeat-core = { path = "../zerobeat-core" }
zerobeat-ipc = { path = "../zerobeat-ipc" }
zerobeat-protocol = { path = "../zerobeat-protocol" }
zerobeat-runtime = { path = "../zerobeat-runtime" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
zerobeat-daemon = { path = "../zerobeat-daemon" }

[[bin]]
name = "zerobeat-cli"
path = "src/main.rs"
