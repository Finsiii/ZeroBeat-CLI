name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  DEBIAN12_IMAGE: 'debian:12.12@sha256:c66c66fac809bfb56a8001b12f08181a49b6db832d2c8ddabe22b6374264055f'
  DEBIAN13_IMAGE: 'debian:13.1@sha256:01a723bf5bfb21b9dda0c9a33e0538106e4d02cce8f557e118dd61259553d598'
  DEBIAN12_ARM64_IMAGE: 'debian:12.12@sha256:c66c66fac809bfb56a8001b12f08181a49b6db832d2c8ddabe22b6374264055f'
  DEBIAN13_ARM64_IMAGE: 'debian:13.1@sha256:01a723bf5bfb21b9dda0c9a33e0538106e4d02cce8f557e118dd61259553d598'
  RUSTUP_VERSION: '1.28.2'
  RUSTUP_X86_64_SHA256: '20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c'
  RUSTUP_AARCH64_SHA256: 'e3853c5a252fca15252d07cb23a1bdd9377a8c6f3efa01531109281ae47f841c'

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential pkg-config \
            libsqlite3-dev libcurl4-openssl-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswresample-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup component add --toolchain 1.96.0 rustfmt clippy
          rustup default 1.96.0

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "release must be tagged vX.Y.Z" >&2; exit 1 ;;
          esac
          expected="${RELEASE_TAG#v}"
          versions="$(grep -hE '^version = "[^"]+"' crates/*/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/' | sort -u)"
          test "$(printf '%s\n' "$versions" | wc -l)" -eq 1
          test "$versions" = "$expected"

      - name: Verify source
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          sh tests/installer_distro_test.sh

      - name: Build release binaries
        run: cargo build --workspace --release --locked

      - name: Check native shared-library resolution
        run: |
          missing="$(ldd target/release/zerobeat-cli | grep 'not found' || true)"
          missing="$missing$(ldd target/release/zerobeatd | grep 'not found' || true)"
          test -z "$missing"

      - name: Package stable Linux x86_64 archive
        id: package
        run: |
          set -eu
          rm -rf dist
          mkdir -p dist/stage
          install -m 755 target/release/zerobeat-cli dist/stage/zerobeat-cli
          install -m 755 target/release/zerobeatd dist/stage/zerobeatd
          install -m 644 README.md dist/stage/README.md
          install -m 644 LICENSE dist/stage/LICENSE
          tar -C dist/stage -czf dist/zerobeat-linux-x86_64.tar.gz \
            zerobeat-cli zerobeatd README.md LICENSE
          (cd dist && sha256sum zerobeat-linux-x86_64.tar.gz) \
            > dist/zerobeat-linux-x86_64.tar.gz.sha256
          echo "archive=dist/zerobeat-linux-x86_64.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/zerobeat-linux-x86_64.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Build and package Arch Linux x86_64 archive
        id: arch-package
        run: |
          set -eu
          arch_dist="$RUNNER_TEMP/zerobeat-arch-dist"
          rm -rf "$arch_dist"
          mkdir -p "$arch_dist"
          build_arch() {
            snapshot=$1
            archive=$2
            docker run --rm \
              --env ARCH_SNAPSHOT="$snapshot" \
              --env ARCHIVE_NAME="$archive" \
              --volume "$GITHUB_WORKSPACE:/src:ro" \
              --volume "$arch_dist:/out" \
              archlinux:base-devel \
              bash -euxo pipefail -c '
              if [ -n "$ARCH_SNAPSHOT" ]; then
                printf "Server = https://archive.archlinux.org/repos/%s/\$repo/os/\$arch\n" \
                  "$ARCH_SNAPSHOT" > /etc/pacman.d/mirrorlist
              fi
              pacman -Syyuu --noconfirm
              pacman -S --noconfirm --needed \
                rustup pkgconf curl sqlite ffmpeg alsa-lib libpulse pipewire
              rustup toolchain install 1.96.0 --profile minimal --no-self-update
              rustup default 1.96.0
              export CARGO_TARGET_DIR=/tmp/zerobeat-target
              cd /src
              cargo build --workspace --release --locked
              for binary in zerobeat-cli zerobeatd; do
                test -x "$CARGO_TARGET_DIR/release/$binary"
                missing="$(ldd "$CARGO_TARGET_DIR/release/$binary" | grep "not found" || true)"
                test -z "$missing"
              done
              stage="$(mktemp -d /tmp/zerobeat-arch-stage.XXXXXX)"
              trap "rm -rf \"$stage\"" EXIT
              install -m 755 "$CARGO_TARGET_DIR/release/zerobeat-cli" "$stage/zerobeat-cli"
              install -m 755 "$CARGO_TARGET_DIR/release/zerobeatd" "$stage/zerobeatd"
              install -m 644 /src/README.md "$stage/README.md"
              install -m 644 /src/LICENSE "$stage/LICENSE"
              tar -C "$stage" -czf "/out/$ARCHIVE_NAME" \
                zerobeat-cli zerobeatd README.md LICENSE
              (cd /out && sha256sum "$ARCHIVE_NAME") \
                > "/out/$ARCHIVE_NAME.sha256"
              install_prefix=/tmp/zerobeat-installer-smoke
              rm -rf "$install_prefix"
              ZEROBEAT_ALLOW_LOCAL_TEST=1 \
                ZEROBEAT_RELEASE_BASE_URL=file:///out \
                PREFIX="$install_prefix" \
                sh /src/install.sh
              test -x "$install_prefix/bin/zerobeat-cli"
              test -x "$install_prefix/bin/zerobeatd"
              PREFIX="$install_prefix" sh /src/install.sh --uninstall
              test ! -e "$install_prefix/bin/zerobeat-cli"
              test ! -e "$install_prefix/bin/zerobeatd"
            '
          }
          build_arch 2026/05/23 zerobeat-linux-arch-ffmpeg8-x86_64.tar.gz
          build_arch 2026/08/24 zerobeat-linux-arch-ffmpeg9-x86_64.tar.gz
          echo "ffmpeg8_archive=$arch_dist/zerobeat-linux-arch-ffmpeg8-x86_64.tar.gz" >> "$GITHUB_OUTPUT"
          echo "ffmpeg8_checksum=$arch_dist/zerobeat-linux-arch-ffmpeg8-x86_64.tar.gz.sha256" >> "$GITHUB_OUTPUT"
          echo "ffmpeg9_archive=$arch_dist/zerobeat-linux-arch-ffmpeg9-x86_64.tar.gz" >> "$GITHUB_OUTPUT"
          echo "ffmpeg9_checksum=$arch_dist/zerobeat-linux-arch-ffmpeg9-x86_64.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Build and package Debian Linux x86_64 archives
        id: debian-package
        run: |
          set -eu
          debian_dist="$RUNNER_TEMP/zerobeat-debian-dist"
          rm -rf "$debian_dist"
          mkdir -p "$debian_dist"
          build_debian() {
            image=$1
            archive=$2
            docker run --rm --platform linux/amd64 \
              --env ARCHIVE_NAME="$archive" \
              --env RUSTUP_VERSION \
              --env RUSTUP_X86_64_SHA256 \
              --volume "$GITHUB_WORKSPACE:/src:ro" \
              --volume "$debian_dist:/out" \
              "$image" \
              sh -eu -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install --yes --no-install-recommends \
                bash build-essential pkg-config ca-certificates curl git \
                libsqlite3-dev libcurl4-openssl-dev \
                libavformat-dev libavcodec-dev libavutil-dev libswresample-dev \
                libasound2-dev libpulse-dev libpipewire-0.3-dev
              test "$(dpkg --print-architecture)" = amd64
              test "$(uname -m)" = x86_64
              rustup_url="https://static.rust-lang.org/rustup/archive/$RUSTUP_VERSION/x86_64-unknown-linux-gnu/rustup-init"
              curl --proto "=https" --tlsv1.2 --fail --silent --show-error \
                "$rustup_url" --output /tmp/rustup-init
              printf "%s  %s\n" "$RUSTUP_X86_64_SHA256" /tmp/rustup-init | sha256sum -c -
              chmod 755 /tmp/rustup-init
              /tmp/rustup-init -y --profile minimal \
                --default-toolchain 1.96.0 --no-modify-path
              export PATH="/root/.cargo/bin:$PATH"
              rustc --version | grep -Eq "^rustc 1[.]96[.]0( |$)"
              export CARGO_TARGET_DIR=/tmp/zerobeat-target
              cd /src
              cargo build --workspace --release --locked
              for binary in zerobeat-cli zerobeatd; do
                test -x "$CARGO_TARGET_DIR/release/$binary"
                missing="$(ldd "$CARGO_TARGET_DIR/release/$binary" | grep "not found" || true)"
                test -z "$missing"
              done
              stage="$(mktemp -d /tmp/zerobeat-debian-stage.XXXXXX)"
              trap "rm -rf \"$stage\"" EXIT
              install -m 755 "$CARGO_TARGET_DIR/release/zerobeat-cli" "$stage/zerobeat-cli"
              install -m 755 "$CARGO_TARGET_DIR/release/zerobeatd" "$stage/zerobeatd"
              install -m 644 /src/README.md "$stage/README.md"
              install -m 644 /src/LICENSE "$stage/LICENSE"
              tar -C "$stage" -czf "/out/$ARCHIVE_NAME" \
                zerobeat-cli zerobeatd README.md LICENSE
              expected_entries="$(printf "%s\\n" zerobeat-cli zerobeatd README.md LICENSE)"
              actual_entries="$(tar -tzf "/out/$ARCHIVE_NAME")"
              test "$actual_entries" = "$expected_entries"
              (cd /out && sha256sum "$ARCHIVE_NAME") \
                > "/out/$ARCHIVE_NAME.sha256"
              install_prefix=/tmp/zerobeat-installer-smoke
              rm -rf "$install_prefix"
              ZEROBEAT_ALLOW_LOCAL_TEST=1 \
                ZEROBEAT_RELEASE_BASE_URL=file:///out \
                PREFIX="$install_prefix" \
                sh /src/install.sh
              test -x "$install_prefix/bin/zerobeat-cli"
              test -x "$install_prefix/bin/zerobeatd"
              PREFIX="$install_prefix" sh /src/install.sh --uninstall
              test ! -e "$install_prefix/bin/zerobeat-cli"
              test ! -e "$install_prefix/bin/zerobeatd"
            '
          }
          build_debian "$DEBIAN12_IMAGE" zerobeat-linux-debian12-x86_64.tar.gz
          build_debian "$DEBIAN13_IMAGE" zerobeat-linux-debian13-x86_64.tar.gz
          echo "debian12_archive=$debian_dist/zerobeat-linux-debian12-x86_64.tar.gz" >> "$GITHUB_OUTPUT"
          echo "debian12_checksum=$debian_dist/zerobeat-linux-debian12-x86_64.tar.gz.sha256" >> "$GITHUB_OUTPUT"
          echo "debian13_archive=$debian_dist/zerobeat-linux-debian13-x86_64.tar.gz" >> "$GITHUB_OUTPUT"
          echo "debian13_checksum=$debian_dist/zerobeat-linux-debian13-x86_64.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Attest Ubuntu release archive
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Attest Arch Linux FFmpeg 8 release archive
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.arch-package.outputs.ffmpeg8_archive }}

      - name: Attest Arch Linux FFmpeg 9 release archive
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.arch-package.outputs.ffmpeg9_archive }}

      - name: Attest Debian 12 release archive
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.debian-package.outputs.debian12_archive }}

      - name: Attest Debian 13 release archive
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.debian-package.outputs.debian13_archive }}

      - name: Stage draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -- \
            "dist/zerobeat-linux-x86_64.tar.gz" \
            "dist/zerobeat-linux-x86_64.tar.gz.sha256" \
            "${{ steps.arch-package.outputs.ffmpeg8_archive }}" \
            "${{ steps.arch-package.outputs.ffmpeg8_checksum }}" \
            "${{ steps.arch-package.outputs.ffmpeg9_archive }}" \
            "${{ steps.arch-package.outputs.ffmpeg9_checksum }}" \
            "${{ steps.debian-package.outputs.debian12_archive }}" \
            "${{ steps.debian-package.outputs.debian12_checksum }}" \
            "${{ steps.debian-package.outputs.debian13_archive }}" \
            "${{ steps.debian-package.outputs.debian13_checksum }}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
            gh release upload "$RELEASE_TAG" "$@" --clobber
          else
            gh release create "$RELEASE_TAG" "$@" \
              --draft \
              --title "ZeroBeat $RELEASE_TAG" \
              --generate-notes
          fi

  release-arm64:
    needs: release
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}

      - name: Install Ubuntu ARM64 native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential pkg-config \
            libsqlite3-dev libcurl4-openssl-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswresample-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev

      - name: Install pinned Rust ARM64 toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Build and package Ubuntu 24.04 ARM64 archive
        run: |
          set -eu
          rm -rf dist-arm64
          mkdir -p dist-arm64/stage
          cargo build --workspace --release --locked
          for binary in zerobeat-cli zerobeatd; do
            binary_path="target/release/$binary"
            test -x "$binary_path"
            readelf -h "$binary_path" | grep -Fq "Machine: AArch64"
            missing="$(ldd "$binary_path" | grep "not found" || true)"
            test -z "$missing"
            install -m 755 "$binary_path" "dist-arm64/stage/$binary"
          done
          install -m 644 README.md dist-arm64/stage/README.md
          install -m 644 LICENSE dist-arm64/stage/LICENSE
          tar -C dist-arm64/stage -czf dist-arm64/zerobeat-linux-ubuntu24-aarch64.tar.gz \
            zerobeat-cli zerobeatd README.md LICENSE
          expected_entries="$(printf "%s\\n" zerobeat-cli zerobeatd README.md LICENSE)"
          actual_entries="$(tar -tzf dist-arm64/zerobeat-linux-ubuntu24-aarch64.tar.gz)"
          test "$actual_entries" = "$expected_entries"
          (cd dist-arm64 && sha256sum zerobeat-linux-ubuntu24-aarch64.tar.gz) \
            > dist-arm64/zerobeat-linux-ubuntu24-aarch64.tar.gz.sha256
          install_prefix="$RUNNER_TEMP/zerobeat-installer-smoke"
          rm -rf "$install_prefix"
          ZEROBEAT_ALLOW_LOCAL_TEST=1 \
            ZEROBEAT_RELEASE_BASE_URL="file://$GITHUB_WORKSPACE/dist-arm64" \
            PREFIX="$install_prefix" \
            sh install.sh
          test -x "$install_prefix/bin/zerobeat-cli"
          test -x "$install_prefix/bin/zerobeatd"
          PREFIX="$install_prefix" sh install.sh --uninstall
          test ! -e "$install_prefix/bin/zerobeat-cli"
          test ! -e "$install_prefix/bin/zerobeatd"

      - name: Build and package Debian ARM64 archives
        run: |
          set -eu
          arm64_dist="$GITHUB_WORKSPACE/dist-arm64"
          mkdir -p "$arm64_dist"
          build_debian_arm64() {
            image=$1
            archive=$2
            docker run --rm --platform linux/arm64 \
              --env ARCHIVE_NAME="$archive" \
              --env RUSTUP_VERSION \
              --env RUSTUP_AARCH64_SHA256 \
              --volume "$GITHUB_WORKSPACE:/src:ro" \
              --volume "$arm64_dist:/out" \
              "$image" \
              sh -eu -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install --yes --no-install-recommends \
                bash build-essential pkg-config ca-certificates curl git \
                libsqlite3-dev libcurl4-openssl-dev \
                libavformat-dev libavcodec-dev libavutil-dev libswresample-dev \
                libasound2-dev libpulse-dev libpipewire-0.3-dev
              test "$(dpkg --print-architecture)" = arm64
              test "$(uname -m)" = aarch64
              rustup_url="https://static.rust-lang.org/rustup/archive/$RUSTUP_VERSION/aarch64-unknown-linux-gnu/rustup-init"
              curl --proto "=https" --tlsv1.2 --fail --silent --show-error \
                "$rustup_url" --output /tmp/rustup-init
              printf "%s  %s\n" "$RUSTUP_AARCH64_SHA256" /tmp/rustup-init | sha256sum -c -
              chmod 755 /tmp/rustup-init
              /tmp/rustup-init -y --profile minimal \
                --default-toolchain 1.96.0 --no-modify-path
              export PATH="/root/.cargo/bin:$PATH"
              rustc --version | grep -Eq "^rustc 1[.]96[.]0( |$)"
              export CARGO_TARGET_DIR=/tmp/zerobeat-target
              cd /src
              cargo build --workspace --release --locked
              for binary in zerobeat-cli zerobeatd; do
                binary_path="$CARGO_TARGET_DIR/release/$binary"
                test -x "$binary_path"
                readelf -h "$binary_path" | grep -Fq "Machine: AArch64"
                missing="$(ldd "$binary_path" | grep "not found" || true)"
                test -z "$missing"
              done
              stage="$(mktemp -d /tmp/zerobeat-debian-arm64-stage.XXXXXX)"
              trap "rm -rf \"$stage\"" EXIT
              install -m 755 "$CARGO_TARGET_DIR/release/zerobeat-cli" "$stage/zerobeat-cli"
              install -m 755 "$CARGO_TARGET_DIR/release/zerobeatd" "$stage/zerobeatd"
              install -m 644 /src/README.md "$stage/README.md"
              install -m 644 /src/LICENSE "$stage/LICENSE"
              tar -C "$stage" -czf "/out/$ARCHIVE_NAME" \
                zerobeat-cli zerobeatd README.md LICENSE
              expected_entries="$(printf "%s\\n" zerobeat-cli zerobeatd README.md LICENSE)"
              actual_entries="$(tar -tzf "/out/$ARCHIVE_NAME")"
              test "$actual_entries" = "$expected_entries"
              (cd /out && sha256sum "$ARCHIVE_NAME") \
                > "/out/$ARCHIVE_NAME.sha256"
              install_prefix=/tmp/zerobeat-installer-smoke
              rm -rf "$install_prefix"
              ZEROBEAT_ALLOW_LOCAL_TEST=1 \
                ZEROBEAT_RELEASE_BASE_URL=file:///out \
                PREFIX="$install_prefix" \
                sh /src/install.sh
              test -x "$install_prefix/bin/zerobeat-cli"
              test -x "$install_prefix/bin/zerobeatd"
              PREFIX="$install_prefix" sh /src/install.sh --uninstall
              test ! -e "$install_prefix/bin/zerobeat-cli"
              test ! -e "$install_prefix/bin/zerobeatd"
            '
          }
          build_debian_arm64 "$DEBIAN12_ARM64_IMAGE" zerobeat-linux-debian12-aarch64.tar.gz
          build_debian_arm64 "$DEBIAN13_ARM64_IMAGE" zerobeat-linux-debian13-aarch64.tar.gz

      - name: Attest Debian 12 ARM64 release archive
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist-arm64/zerobeat-linux-debian12-aarch64.tar.gz

      - name: Attest Ubuntu 24.04 ARM64 release archive
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist-arm64/zerobeat-linux-ubuntu24-aarch64.tar.gz

      - name: Attest Debian 13 ARM64 release archive
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist-arm64/zerobeat-linux-debian13-aarch64.tar.gz

      - name: Upload ARM64 release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist-arm64/zerobeat-linux-ubuntu24-aarch64.tar.gz \
            dist-arm64/zerobeat-linux-ubuntu24-aarch64.tar.gz.sha256 \
            dist-arm64/zerobeat-linux-debian12-aarch64.tar.gz \
            dist-arm64/zerobeat-linux-debian12-aarch64.tar.gz.sha256 \
            dist-arm64/zerobeat-linux-debian13-aarch64.tar.gz \
            dist-arm64/zerobeat-linux-debian13-aarch64.tar.gz.sha256 \
            --clobber

      - name: Publish complete GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release edit "$RELEASE_TAG" --draft=false --latest
